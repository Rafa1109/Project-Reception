<app-navbar></app-navbar>
<base-content>
    <div class="col-12">
        <div class="row">
            <div class="col-12 col-md-12">
                <div class="">
                    <h2 class="d-md-block text-center text-md-left">Novo Pedido</h2>
                </div>
            </div>
            <div class="col-12 d-md-block">
                <p-divider></p-divider>
            </div>
        </div>
    </div>

    <div class="col-12">
        <div class="row">
            <div class="col-12">
                <form class="row g-3" [formGroup]="form" (ngSubmit)="onSubmit()">
                    <!-- CPF -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block mb-1">CPF</label>
                        <p-inputMask formControlName="cpf" mask="999.999.999-99" class="w-100"
                            placeholder="___.___.___-__">
                        </p-inputMask> <small class="p-error"
                            *ngIf="form.controls['cpf'].hasError('cpfInvalido') && form.controls['cpf'].touched">
                            CPF inválido!
                        </small>
                    </div>

                    <!-- Nome -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block mb-1">Nome completo</label>
                        <input pInputText formControlName="nomeCompleto" class="w-100" placeholder="Ex.: Maria Silva" />
                    </div>

                    <!-- Apelido -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block mb-1">Apelido</label>
                        <input pInputText formControlName="apelido" class="w-100" placeholder="Ex.: Juninho" />
                    </div>

                    <!-- Email -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block mb-1">Email</label>
                        <input pInputText type="email" formControlName="email" class="w-100"
                            placeholder="nome@dominio.com" />
                    </div>

                    <!-- Telefone -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block mb-1">Telefone</label>
                        <input pInputText formControlName="telefone" class="w-100" placeholder="11999999999"
                            inputmode="tel" />

                        <small class="text-danger"
                            *ngIf="form.get('telefone')?.touched && form.get('telefone')?.errors">
                            <!-- obrigatório -->
                            <span *ngIf="form.get('telefone')?.errors?.['required']">Informe o telefone.</span>
                            <!-- 11 dígitos -->
                            <span *ngIf="form.get('telefone')?.errors?.['phone11']">Telefone deve ter 11 dígitos (DDD +
                                número).</span>
                        </small>
                    </div>

                    <!-- Produto (fixo) -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block mb-1">Produto</label>
                        <input pInputText class="w-100" formControlName="produto" [readonly]="true" />
                    </div>

                    <!-- Valor unitário (fixo) -->
                    <div class="col-12 col-md-3">
                        <label class="form-label d-block mb-1">Valor unitário</label>
                        <input pInputText class="w-100" [readonly]="true"
                            [value]="valorUnitario | currency:'BRL':'symbol-narrow':'1.2-2'" />
                    </div>

                    <!-- Quantidade (+/-) -->
                    <div class="col-12 col-md-3">
                        <label class="form-label d-block mb-1">Quantidade</label>
                        <p-inputNumber formControlName="qtd" [showButtons]="true" [min]="1" [max]="10" [step]="1"
                            inputId="qtd"></p-inputNumber>
                    </div>

                    <!-- Valor Total -->
                    <div class="col-12 col-md-6">
                        <label class="form-label d-block mb-1">Valor total</label>
                        <input pInputText class="w-100" [readonly]="true"
                            [value]="total | currency:'BRL':'symbol-narrow':'1.2-2'" />
                    </div>

                    <!-- Opção de pagamento -->
                    <div class="col-12">
                        <label class="form-label d-block mb-1">Opção de pagamento</label>
                        <div class="d-flex gap-4 align-items-center">
                            <div class="d-flex align-items-center">
                                <p-radioButton name="opcaoPagamento" inputId="pg-pix" value="PIX"
                                    formControlName="opcaoPagamento"></p-radioButton>
                                <label for="pg-pix" class="ml-2 mb-0">Pix</label>
                            </div>
                            <div class="d-flex align-items-center">
                                <p-radioButton name="opcaoPagamento" inputId="pg-cartao" value="CARTAO"
                                    formControlName="opcaoPagamento"></p-radioButton>
                                <label for="pg-cartao" class="ml-2 mb-0">Cartão</label>
                            </div>
                        </div>
                    </div>

                    <!-- Ações -->
                    <div class="col-12">
                        <p-divider></p-divider>
                        <div class="d-flex gap-2">
                            <p-button type="submit" label="Salvar" icon="pi pi-save" [loading]="loading"
                                [disabled]="form.invalid || loading">
                            </p-button>
                            <p-button styleClass="p-button-outlined p-button-secondary" label="Limpar"
                                icon="pi pi-replay" (onClick)="form.reset();">
                            </p-button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</base-content>

<app-payment-dialog #paymentDlg></app-payment-dialog>
